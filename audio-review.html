<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluent — Audio Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script src="header.js" defer></script>
  <script src="settings-dialog.js" defer></script>
  <script src="edit-profile.js" defer></script>
  <script src="custom-select.js" defer></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── Sub-header ── */

    .sub-left { display: flex; align-items: center; gap: 12px; }

    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }

    .all-resolved-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px;
      border: 1.5px solid #86efac;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #166534;
      background: #f0fdf4;
    }

    /* ── Body layout ── */
    .page-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Unit selector bar ── */
    .unit-selector-bar {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 24px;
      flex-shrink: 0;
      background: var(--background);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .unit-selector-bar::-webkit-scrollbar { display: none; }

    .unit-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 16px 11px;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font);
      color: var(--muted-foreground);
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .unit-tab:hover { color: var(--foreground); }
    .unit-tab.active {
      color: var(--foreground);
      font-weight: 600;
      border-bottom-color: var(--primary);
    }
    .unit-tab.settled {
      color: #16a34a;
    }
    .unit-tab.settled .unit-dot { background: #16a34a; }

    .unit-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #D97706;
      flex-shrink: 0;
    }
    .unit-tab.active .unit-dot { background: var(--primary); }

    /* ── Resolution content ── */
    .resolution-content {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Takes panel ── */
    .takes-panel {
      width: 380px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .takes-header {
      padding: 16px 20px 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--foreground);
      flex-shrink: 0;
    }

    .takes-header p {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    /* ── Conflict banner ── */
    .conflict-banner {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin: 0 12px 10px;
      padding: 10px 12px;
      border: 1.5px solid #D97706;
      border-radius: var(--radius);
      background: #FEF3C7;
      color: #92400E;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .conflict-banner.visible { display: flex; }
    .conflict-banner svg { flex-shrink: 0; margin-top: 1px; }

    .takes-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .take-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .take-card.playing {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .take-card.selected-take {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .take-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .take-contributor {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .contributor-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .take-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }

    .contributor-date {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .take-selected-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: #16a34a;
    }
    .take-card.selected-take .take-selected-badge { display: flex; }

    /* ── Audio player row ── */
    .take-player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .play-btn:hover { background: var(--primary-hover); }
    .take-card.selected-take .play-btn { background: #16a34a; }
    .take-card.selected-take .play-btn:hover { background: #15803d; }

    .waveform {
      flex: 1;
      height: 36px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      background: var(--muted);
      cursor: pointer;
    }

    .waveform-bars {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 100%;
      padding: 4px 8px;
    }

    .waveform-bar {
      flex: 1;
      border-radius: 1px;
      background: #CBD5E1;
      transition: background 0.15s;
    }
    .take-card.playing .waveform-bar { background: var(--primary); }
    .take-card.selected-take .waveform-bar { background: #86efac; }
    .take-card.selected-take.playing .waveform-bar { background: #16a34a; }

    .take-duration {
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: nowrap;
      min-width: 36px;
      text-align: right;
    }

    /* ── Select as Draft button ── */
    .select-draft-btn {
      width: 100%;
      padding: 8px 14px;
      border: 1.5px solid var(--primary);
      border-radius: var(--radius);
      background: none;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .select-draft-btn:hover { background: var(--primary); color: white; }
    .take-card.selected-take .select-draft-btn {
      border-color: #16a34a;
      color: #16a34a;
      cursor: default;
    }
    .take-card.selected-take .select-draft-btn:hover { background: none; color: #16a34a; }

    /* ── Preview panel ── */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .preview-header {
      padding: 16px 24px 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--foreground);
      flex-shrink: 0;
    }

    .preview-header p {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    .preview-verse-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }

    .preview-verse-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 0;
    }

    .preview-verse-num {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted-foreground);
      min-width: 1.5rem;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .preview-source-text {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--foreground);
    }

    .preview-unit-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 10px;
    }

  </style>
</head>
<body data-role="manager">

  <div id="fluent-header"></div>

  <!-- Sub-header -->
  <div class="sub-header">
    <div class="sub-left">
      <button class="back-btn" onclick="history.back()" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="page-title">1 John 5 — Audio Review</span>
      <span class="all-resolved-chip" id="all-resolved-chip" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        All Resolved
      </span>
    </div>
  </div>

  <!-- Page body -->
  <div class="page-body">

    <!-- Unit selector -->
    <div class="unit-selector-bar" id="unit-selector-bar"></div>

    <!-- Resolution content -->
    <div class="resolution-content">

      <!-- Takes panel -->
      <div class="takes-panel">
        <div class="takes-header" id="takes-header"></div>
        <div class="conflict-banner" id="conflict-banner">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
          <span>This unit has conflicting takes — select one to resolve.</span>
        </div>
        <div class="takes-list" id="takes-list"></div>
      </div>

      <!-- Preview panel -->
      <div class="preview-panel">
        <div class="preview-header">
          Source Text
          <p>IRV Gujarati reference for this unit</p>
        </div>
        <div class="preview-verse-area" id="preview-verse-area"></div>
      </div>

    </div>
  </div>

  <script>
    // ── Data ─────────────────────────────────────────────────────────────────
    // conflict: server holds multiple takes with no active draft designated yet.
    // Non-conflict units always have an existing activeTake.

    const units = [
      {
        id: 0,
        label: 'Verses 1–5',
        conflict: true,
        resolved: false,
        activeTake: null,
        verses: [1, 2, 3, 4, 5],
        takes: [
          { id: 'take-a', contributor: 'Roslin T', date: 'Jul 22, 2026', duration: '1:47' },
          { id: 'take-b', contributor: 'Priya M',  date: 'Jul 23, 2026', duration: '1:53' },
          { id: 'take-c', contributor: 'Roslin T', date: 'Jul 25, 2026', duration: '1:44' },
        ],
      },
      {
        id: 1,
        label: 'Verses 6–9',
        conflict: false,
        resolved: false,
        activeTake: 'take-f',
        verses: [6, 7, 8, 9],
        takes: [
          { id: 'take-f', contributor: 'Priya M', date: 'Jul 20, 2026', duration: '1:12' },
        ],
      },
      {
        id: 2,
        label: 'Verses 10–12',
        conflict: false,
        resolved: false,
        activeTake: 'take-h',
        verses: [10, 11, 12],
        takes: [
          { id: 'take-g', contributor: 'Roslin T', date: 'Jul 21, 2026', duration: '0:51' },
          { id: 'take-h', contributor: 'Roslin T', date: 'Jul 24, 2026', duration: '0:49' },
        ],
      },
      {
        id: 3,
        label: 'Verses 13–15',
        conflict: true,
        resolved: false,
        activeTake: null,
        verses: [13, 14, 15],
        takes: [
          { id: 'take-d', contributor: 'Roslin T', date: 'Jul 22, 2026', duration: '0:58' },
          { id: 'take-e', contributor: 'Seema K',  date: 'Jul 24, 2026', duration: '1:02' },
        ],
      },
    ];

    const sourceText = {
      1:  'જે કોઈ વિશ્વાસ કરે છે કે ઈસુ ખ્રિસ્ત છે, તે ઈશ્વર થકી જન્મ્યો છે; અને જે ઈશ્વરને ચાહે છે, તે ઈશ્વર થકી જન્મેલાને પણ ચાહે છે.',
      2:  'આ પ્રકારે આપણે ઓળખીએ છીએ કે આપણે ઈશ્વરનાં બાળકોને ચાહીએ છીએ, જ્યારે આપણે ઈશ્વરને ચાહીએ છીએ અને ઈશ્વરની આજ્ઞા પ્રમાણે ચાલીએ છીએ.',
      3:  'ઈશ્વર પ્રત્યેનો પ્રેમ એ છે કે આપણે તેની આજ્ઞાઓ પ્રમાણે ચાલીએ; અને તેની આજ્ઞાઓ ભારે નથી.',
      4:  'કારણ કે ઈશ્વર થકી જન્મેલ દરેક જગतને જીتे છे; અને જે વિજ जगत ने जीत्यो, ते आ छे, एटले आपणो विश्वास.',
      5:  'ઈसु ईश्वरना पुत्र छे, ए विश्वास कोण करे छे, ए सिवाय जगतने जीतनारो बीजो कोण छे?',
      6:  'જગત તેને ઓળખતું નથી, કારણ કે તેમણે તેને ઓળખ્યો નથી.',
      7:  'વ્હાલાંઓ, હવે આપણે ઈશ્વરનાં બાળકો છીએ, અને પછી શું થશે તે હજી પ્રગટ થયું નથી.',
      8:  'આપણે જાણીએ છીએ કે તે પ્રગટ થશે ત્યારે આપણે તેમના જેવા થઈશું.',
      9:  'અને જે કોઈ પોતાનામાં આ આશા રાખે છે તે પોતાને શુદ્ધ કરે છે.',
      10: 'જે કોઈ પાપ કરે છે તે નિયમનું ઉલ્લંઘન કરે છે; પાપ એ નિયમનું ઉલ્લંઘન છે.',
      11: 'અને તમે જાણો છો કે તે પાપોને દૂર કરવા માટે પ્રગટ થયા હતા.',
      12: 'જે કોઈ તેમનામાં રહે છે તે પાપ કરતો નથી.',
      13: 'ઈश्वरना पुत्रना नाम पर विश्वास करनारा, तमने आ वात मे एटला सारू लख्या छे, के तमे जाणो के तमने अनंत जीवन छे.',
      14: 'ईश्वर आगळ आ आपणो भरोसो छे, के जो आपणे तेनी इच्छा प्रमाणे कंई मागीए, तो ते आपणुं सांभळे छे.',
      15: 'अने जो आपणे जाणीए छीए के आपणे जे कोई मागीए ते ते सांभळे छे, तो आपणे जाणीए छीए के जे कोई आपणे माग्युं, ते फळ आपणने मळ्युं छे.',
    };

    let activeUnit = 0;
    let playingTakeId = null;
    let playTimers = {};

    function contributorCount(unit) {
      return new Set(unit.takes.map(function(t) { return t.contributor; })).size;
    }

    // ── Rendering ─────────────────────────────────────────────────────────────

    function renderUnitTabs() {
      const bar = document.getElementById('unit-selector-bar');
      bar.innerHTML = '';
      units.forEach(function(unit, idx) {
        const btn = document.createElement('button');
        const settled = unit.conflict ? unit.resolved : unit.activeTake !== null;
        btn.className = 'unit-tab' + (idx === activeUnit ? ' active' : '') + (settled ? ' settled' : '');
        btn.dataset.unit = idx;
        btn.onclick = function() { selectUnit(idx); };
        let dotHtml = '';
        if (unit.conflict) {
          const dotColor = unit.resolved ? '#16a34a' : (idx === activeUnit ? '' : '#D97706');
          dotHtml = '<span class="unit-dot" style="' + (dotColor ? 'background:' + dotColor + ';' : '') + '"></span>';
        }
        btn.innerHTML = dotHtml + unit.label;
        bar.appendChild(btn);
      });

      const anyConflicts = units.some(function(u) { return u.conflict; });
      const allResolved = anyConflicts && units.filter(function(u) { return u.conflict; }).every(function(u) { return u.resolved; });
      document.getElementById('all-resolved-chip').style.display = allResolved ? 'inline-flex' : 'none';
    }

    function renderTakesHeader() {
      const unit = units[activeUnit];
      const header = document.getElementById('takes-header');
      const banner = document.getElementById('conflict-banner');

      if (unit.conflict && !unit.resolved) {
        header.innerHTML = 'Conflicting Takes<p>Select one take as the active draft. All recordings are retained.</p>';
        banner.classList.add('visible');
      } else if (unit.conflict && unit.resolved) {
        header.innerHTML = 'Recorded Takes<p>This conflict has been resolved. All recordings are retained.</p>';
        banner.classList.remove('visible');
      } else {
        header.innerHTML = 'Recorded Takes<p>Listen to every recorded take for this unit.</p>';
        banner.classList.remove('visible');
      }
    }

    function renderTakes() {
      const unit = units[activeUnit];
      const list = document.getElementById('takes-list');
      list.innerHTML = '';
      const showNames = contributorCount(unit) > 1;

      unit.takes.forEach(function(take, i) {
        const isSelected = unit.activeTake === take.id;
        const isPlaying  = playingTakeId === take.id;
        const showSelectButton = unit.conflict && !unit.resolved;

        const card = document.createElement('div');
        card.className = 'take-card' + (isPlaying ? ' playing' : '') + (isSelected ? ' selected-take' : '');
        card.id = 'card-' + take.id;

        const barHeights = [30,55,45,70,40,85,60,50,75,45,65,80,35,55,70,45,60,50,40,65,55,75,45,60,70,50,40,65,55,45];
        const bars = barHeights.map(function(h) {
          return '<div class="waveform-bar" style="height:' + h + '%;"></div>';
        }).join('');

        const playIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
        const pauseIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>';
        const checkIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        const nameHtml = showNames
          ? '<div class="contributor-name"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-foreground);flex-shrink:0"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>' + take.contributor + '</div>'
          : '<div class="take-label">Take ' + (i + 1) + '</div>';

        card.innerHTML =
          '<div class="take-meta">' +
            '<div class="take-contributor">' +
              '<div>' +
                nameHtml +
                '<div class="contributor-date">Recorded ' + take.date + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="take-selected-badge">' + checkIcon + ' Current Draft</div>' +
          '</div>' +
          '<div class="take-player">' +
            '<button class="play-btn" data-take="' + take.id + '" onclick="togglePlay(\'' + take.id + '\')">' +
              (isPlaying ? pauseIcon : playIcon) +
            '</button>' +
            '<div class="waveform" onclick="togglePlay(\'' + take.id + '\')">' +
              '<div class="waveform-bars">' + bars + '</div>' +
            '</div>' +
            '<span class="take-duration">' + take.duration + '</span>' +
          '</div>' +
          (showSelectButton
            ? (isSelected
                ? '<button class="select-draft-btn">' + checkIcon + ' Selected as Draft</button>'
                : '<button class="select-draft-btn" onclick="selectDraft(\'' + take.id + '\')">' + checkIcon + ' Select as Draft</button>')
            : '');

        list.appendChild(card);
      });
    }

    function renderPreview() {
      const unit = units[activeUnit];
      const area = document.getElementById('preview-verse-area');
      area.innerHTML = '<div class="preview-unit-label">' + unit.label + '</div>';

      unit.verses.forEach(function(n) {
        const row = document.createElement('div');
        row.className = 'preview-verse-row';
        row.innerHTML =
          '<span class="preview-verse-num">' + n + '</span>' +
          '<span class="preview-source-text">' + esc(sourceText[n] || '') + '</span>';
        area.appendChild(row);
      });
    }

    function render() {
      renderUnitTabs();
      renderTakesHeader();
      renderTakes();
      renderPreview();
    }

    // ── Interactions ──────────────────────────────────────────────────────────

    function selectUnit(idx) {
      stopCurrentPlayback();
      activeUnit = idx;
      render();
    }

    function togglePlay(takeId) {
      if (playingTakeId === takeId) {
        stopCurrentPlayback();
      } else {
        stopCurrentPlayback();
        playingTakeId = takeId;
        renderTakes();
        const unit = units[activeUnit];
        const take = unit.takes.find(function(t) { return t.id === takeId; });
        if (take) {
          const parts = take.duration.split(':');
          const secs = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
          playTimers[takeId] = setTimeout(function() {
            if (playingTakeId === takeId) {
              stopCurrentPlayback();
            }
          }, secs * 1000);
        }
      }
    }

    function stopCurrentPlayback() {
      if (playingTakeId && playTimers[playingTakeId]) {
        clearTimeout(playTimers[playingTakeId]);
        delete playTimers[playingTakeId];
      }
      playingTakeId = null;
      renderTakes();
    }

    function selectDraft(takeId) {
      stopCurrentPlayback();
      const unit = units[activeUnit];
      unit.activeTake = takeId;
      unit.resolved = true;
      render();
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Init ─────────────────────────────────────────────────────────────────

    window.addEventListener('load', render);
  </script>
</body>
</html>
