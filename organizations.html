<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluent — Organizations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script src="header.js" defer></script>
  <script src="settings-dialog.js" defer></script>
  <script src="edit-profile.js" defer></script>
  <script src="custom-select.js" defer></script>
  <style>

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-title { font-size: 26px; font-weight: 700; }

    .btn-add-org {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      padding: 0 16px;
      height: 36px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add-org:hover { background: #e8effc; }

    /* ── Table ── */

    

    

    

    /* ── Dialog (matches users.html Add User dialog) ── */
    .dialog-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .dialog-backdrop.open { display: flex; }

    .dialog {
      background: var(--background);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      width: 440px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .dialog-title { font-size: 18px; font-weight: 700; }
    .dialog-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-foreground);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dialog-close:hover { background: var(--muted); color: var(--foreground); }

    .dialog-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .required-star { color: #dc2626; }
    .form-error { font-size: 12px; color: #dc2626; }

    .form-input {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--foreground);
      background: var(--background);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--primary); }

    .dialog-footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 0 20px;
      height: 36px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-submit.active { opacity: 1; pointer-events: auto; }
    .btn-submit.active:hover { background: var(--primary-hover); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1a1a1a;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 600;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body data-role="super-admin">

  <div id="fluent-header"></div>

  <main class="content">
    <div class="page-header">
      <h1 class="page-title">Organizations</h1>
      <button class="btn-add-org" id="open-create-org">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create Organization
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Org Managers</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="orgs-tbody">
          <tr onclick="window.location='organization-detail.html'" data-name="bcs">
            <td>BCS</td>
            <td>1</td>
            <td>Jan 15, 2025</td>
          </tr>
          <tr onclick="window.location='organization-detail.html'" data-name="wycliffe global partners">
            <td>Wycliffe Global Partners</td>
            <td>0</td>
            <td>Mar 2, 2025</td>
          </tr>
          <tr onclick="window.location='organization-detail.html'" data-name="seed company">
            <td>Seed Company</td>
            <td>2</td>
            <td>Jun 20, 2025</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create Organization Dialog -->
  <div class="dialog-backdrop" id="create-org-backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-org-title">
      <div class="dialog-header">
        <span class="dialog-title" id="create-org-title">Create Organization</span>
        <button class="dialog-close" id="close-create-org" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="dialog-body">
        <div class="form-field">
          <label class="form-label" for="org-name-field">
            <span class="required-star">*</span> Name
          </label>
          <input class="form-input" type="text" id="org-name-field" autocomplete="off">
        </div>
        <div class="form-field" id="org-name-error-field" style="display:none">
          <span class="form-error">An organization with this name already exists.</span>
        </div>
      </div>

      <div class="dialog-footer">
        <button class="btn-submit" id="btn-create-org">Create Organization</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const backdrop   = document.getElementById('create-org-backdrop');
    const openBtn    = document.getElementById('open-create-org');
    const closeBtn   = document.getElementById('close-create-org');
    const submitBtn  = document.getElementById('btn-create-org');
    const nameField  = document.getElementById('org-name-field');
    const nameError  = document.getElementById('org-name-error-field');

    function existingOrgNames() {
      return Array.from(document.querySelectorAll('#orgs-tbody tr')).map(r => r.dataset.name);
    }

    function openDialog() {
      backdrop.classList.add('open');
      nameField.focus();
    }

    function closeDialog() {
      backdrop.classList.remove('open');
      nameField.value = '';
      nameError.style.display = 'none';
      checkRequired();
    }

    function checkRequired() {
      const isDuplicate = existingOrgNames().includes(nameField.value.trim().toLowerCase());
      nameError.style.display = isDuplicate ? '' : 'none';
      submitBtn.classList.toggle('active', nameField.value.trim() !== '' && !isDuplicate);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    openBtn.addEventListener('click', openDialog);
    closeBtn.addEventListener('click', closeDialog);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) e.stopPropagation(); });
    nameField.addEventListener('input', checkRequired);

    submitBtn.addEventListener('click', () => {
      if (!submitBtn.classList.contains('active')) return;
      backdrop.classList.remove('open');
      // On success the Org list navigates straight to the new org's detail
      // page with the Invite Org Manager dialog open.
      window.location = 'organization-detail.html?modal=add';
    });
  </script>

</body>
</html>
