<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluent — Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script src="../language-data.js" defer></script>
  <script src="../components.js" defer></script>
  <style>
    /* ── Page Content ── */
    .content { padding: 18px 20px; }

    .page-title { font-size: 26px; font-weight: 700; margin-bottom: 20px; }

    /* ── Table ── */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: var(--card); }

    thead th {
      padding: 11px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { background: var(--background); border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--muted); }

    tbody td { padding: 12px 16px; font-size: 14px; }
    tbody td a { color: inherit; text-decoration: none; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-active    { background: #0b50d0; color: white; }
    .badge-stalled   { background: #e48f06; color: white; }
    .badge-outline   { background: transparent; color: var(--muted-foreground); border: 1px solid var(--border); }

    /* ── Progress bar ── */
    .progress {
      width: 160px;
      height: 10px;
      background: #C4CAD6;
      border-radius: 99px;
      overflow: hidden;
      display: flex;
    }
    .p-complete  { background: #16A34A; height: 100%; }
    .p-advanced  { background: #1D9BF0; height: 100%; }
    .p-community { background: #9333EA; height: 100%; }
    .p-peer      { background: #EA580C; height: 100%; }
    .p-drafting  { background: #FDE047; height: 100%; }
  </style>
</head>
<body>

  <div id="fluent-header"></div>

  <main class="content">
    <h1 class="page-title">Projects</h1>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Project</th>
            <th>Language Pair</th>
            <th>Milestones</th>
            <th>Overall Progress</th>
          </tr>
        </thead>
        <tbody id="projects-tbody">
          <tr onclick="window.location='view-project.html'"
              data-title="Kukna NT" data-target="Kukna"
              data-activity="2026-05-15" data-status="potentially_stalled">
            <td>Kukna NT</td>
            <td>Gujarati - Kukna</td>
            <td>1</td>
            <td><div class="progress"><div class="p-complete" style="width:52%"></div><div class="p-advanced" style="width:10%"></div><div class="p-peer" style="width:4%"></div></div></td>
          </tr>
          <tr onclick="window.location='view-project.html'"
              data-title="Varli NT" data-target="Varli Davri"
              data-activity="2026-05-05" data-status="potentially_stalled">
            <td>Varli NT</td>
            <td>Gujarati - Varli Davri</td>
            <td>2</td>
            <td><div class="progress"><div class="p-complete" style="width:12%"></div><div class="p-community" style="width:5%"></div><div class="p-drafting" style="width:3%"></div></div></td>
          </tr>
          <tr onclick="window.location='view-project.html'"
              data-title="Kachi Koli NT" data-target="Kachi Koli"
              data-activity="2026-04-20" data-status="potentially_stalled">
            <td>Kachi Koli NT</td>
            <td>Gujarati - Kachi Koli</td>
            <td>2</td>
            <td><div class="progress"><div class="p-complete" style="width:28%"></div><div class="p-advanced" style="width:15%"></div><div class="p-community" style="width:20%"></div></div></td>
          </tr>
          <tr onclick="window.location='view-project.html'"
              data-title="Tamang NT" data-target="Tamang"
              data-activity="" data-status="not_assigned">
            <td>Tamang NT</td>
            <td>Nepali - Tamang</td>
            <td>0</td>
            <td><div class="progress"></div></td>
          </tr>
          <tr onclick="window.location='view-project.html'"
              data-title="Western Magar NT" data-target="Western Magar"
              data-activity="" data-status="not_assigned">
            <td>Western Magar NT</td>
            <td>Nepali - Western Magar</td>
            <td>1</td>
            <td><div class="progress"></div></td>
          </tr>
          <tr onclick="window.location='view-project.html'"
              data-title="Ewe NT" data-target="Ewe"
              data-activity="2026-05-20" data-status="potentially_stalled">
            <td>Ewe NT</td>
            <td>French - Ewe</td>
            <td>1</td>
            <td><div class="progress"><div class="p-complete" style="width:15%"></div><div class="p-advanced" style="width:20%"></div><div class="p-community" style="width:25%"></div></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('projects-tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort((a, b) => a.dataset.title.localeCompare(b.dataset.title));
      rows.forEach(row => tbody.appendChild(row));
    });
  </script>

</body>
</html>
